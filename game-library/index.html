var GLGame2048 = (function () {
  'use strict';

  var T = GLTheme;
  var GAME_ID = '2048';

  function targetOf(app) {

  }

  function sfx(app, name) {
    if (!app.settings || !app.settings.sound) return;

  }

  function haptic(app) {

    lastVibrate = now;
    GLPlatform.vibrate();
  }

  function saveSession(app) {
    var s = app.session;
    if (!s) return true;
    if (s.state.status === 'ended') {
      GLStore.clearSave(GAME_ID);
      app.save = null;
      return true;
    }
    var ok = GLStore.saveGame(GAME_ID, s.state);
    if (!ok && !s.saveFailShown) {
      s.saveFailShown = true;
      app.showToast('存档失败，请保持页面开启');
    }
    return ok;
  }

  function startNew(app) {
    var rng = GLRng.create(GLRng.seed());
    var state = GL2048.newGame(rng, targetOf(app));
    app.stats = GLStore.getStats(GAME_ID);
    app.session = {
      state: state,
      rng: rng,
      anim: null,
      buffer: null,
      bestBefore: app.stats.bestScore,
      settled: false,
      saveFailShown: false,
      pendingVictory: false,
      pendingResult: false
    };
    app.scene = 'game';
    app.overlay = null;
    app.result = null;
    app.save = null;
    saveSession(app);
    app.dirty = true;
    sfx(app, 'tap');
  }

  function resume(app, save) {
    var rng = GLRng.create(save.rngState);
    var state = GL2048.fromBoard(save.board, {
      score: save.score,
      maxTile: save.maxTile,
      won: save.won,
      status: 'playing',
      rngState: save.rngState,
      target: save.target
    });
    app.stats = GLStore.getStats(GAME_ID);
    app.session = {
      state: state,
      rng: rng,
      anim: null,
      buffer: null,
      bestBefore: Math.max(app.stats.bestScore, state.score),
      settled: false,
      saveFailShown: false,
      pendingVictory: false,
      pendingResult: false
    };
    app.scene = 'game';
    app.overlay = null;
    app.result = null;
    app.save = null;
    saveSession(app);
